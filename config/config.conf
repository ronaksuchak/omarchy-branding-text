# omarchy-branding-text configuration
#
# Edit this file, then run: omarchy branding text apply
# Every value is a shell assignment. Per-theme overrides live in
# ~/.config/omarchy-branding-text/themes/<theme-slug>.conf and are loaded
# after this file when that theme is active.

# The wordmark: login screen, boot splash, boot menu and the terminal art.
TEXT="OMARCHY"

# Font preset: narrow | heavy | wide | serif | mono | custom
STYLE="narrow"

# Explicit font file; overrides STYLE when set.
FONT=""

# Use an image (png, svg, jpg, webp) instead of rendered text for the login
# screen and boot splash. Its dark/alpha pixels become the screensaver art.
# Empty means "render TEXT with STYLE/FONT".
IMAGE=""

# Repaint an IMAGE with the accent colour. Useful for single-colour logos.
IMAGE_TINT="false"

# Canvas the wordmark is centred in. The stock Omarchy logo is 800x188.
LOGO_SIZE="800x188"

# Extra letter spacing in pixels; may be negative.
LETTER_SPACING=0

# theme = take colours from the active Omarchy theme (colors.toml)
# fixed = use ACCENT/BACKGROUND/FOREGROUND/RED exactly as written below
COLORS="theme"

# Manual colours (#rrggbb), used when COLORS=fixed. Empty falls back to the
# stock Omarchy palette.
ACCENT=""
BACKGROUND=""
FOREGROUND=""
RED=""

# Surfaces to brand, comma separated: session,login,splash,bootmenu
#   session  - screensaver and About art (~/.config/omarchy/branding)
#   login    - SDDM login theme
#   splash   - Plymouth boot splash (embedded in the initramfs)
#   bootmenu - Limine menu title and accent
SURFACES="session,login,splash,bootmenu"

# Terminal art bounds (columns x rows) for the screensaver and About.
ART_WIDTH=81
ART_HEIGHT=10
ABOUT_WIDTH=54
ABOUT_HEIGHT=26

# Brightness cut-off (percent) when turning an IMAGE into terminal art.
ART_THRESHOLD=50

# Boot menu title. Empty means the upper-cased TEXT.
BOOTMENU_TITLE=""

# Boot menu colour, six hex digits without '#'. Empty means the accent.
BOOTMENU_COLOR=""

# Repaint the login screen and boot menu when the Omarchy theme changes.
FOLLOW_THEME="true"

# Repaint the boot splash on theme changes too. This rebuilds the initramfs
# (about a minute), so it is off by default.
THEME_UPDATE_SPLASH="false"

# Embed the splash into the initramfs on every apply. Set to false to skip the
# rebuild and apply only the login/session/boot-menu changes.
REBUILD_INITRAMFS="true"
